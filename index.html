{ic:"🛡️",t:"Pourquoi protéger le SI ?",

["Un pirate modifie les prix dans une base de données. Quel critère est touché ?","L’intégrité",[["La disponibilité","Les données restent accessibles : elles sont seulement modifiées."],["La confidentialité","Rien n’a été lu par un tiers : il s’agit d’une modification."],["La preuve","La preuve sert à savoir qui a fait quoi, pas à empêcher l’altération."]]]],

{ic:"🎯",t:"Menaces et attaquants",
L:[["4 grandes menaces (ANSSI)","<b>Déstabilisation</b> (déni de service, défiguration, divulgation), <b>espionnage</b> (point d’eau, spearfishing), <b>sabotage</b> (provoquer une panne) et <b>cybercriminalité</b> (rançongiciel, hameçonnage)."],

["3 profils d’attaquants","1) <b>Organisations structurées</b> (États, crime organisé) : gain, moyens énormes. 2) <b>Groupes idéologiques</b> (terroristes, activistes). 3) <b>Individus spécialisés</b> aux moyens limités."],

{ic:"🏰",t:"Surface d’attaque et défense",
L:[["La surface d’attaque","Ce sont toutes les <b>portes d’entrée</b> du SI, de trois types : <b>physique</b> (locaux), <b>numérique</b> (tout ce qui est ciblable en ligne) et <b>humaine</b> (ingénierie sociale). Un pirate n’a besoin que d’<u>une seule</u> faille."],

["Les outils à connaître","<b>NMAP</b> (scan de ports), antivirus, <b>EDR</b>, pare-feu (pfSense), <b>IDS</b> (Snort) et <b>IPS</b> (Suricata), <b>CMDB</b> (GLPI), scans de vulnérabilités (OpenVAS). Surveillance : Nagios, Zabbix, Centreon."],

["PCA, PRA, logs, audit","<b>PCA</b> : continuer l’activité en cas d’incident (sauvegardes). <b>PRA</b> : reprendre après un sinistre majeur (site de secours). Les <b>logs</b> assurent la traçabilité ; l’<b>audit</b> évalue les procédures (feuilles FRAP)."]],
M:[["Surface humaine","Ingénierie sociale, chantage"],["Surface physique","Locaux et intrusions sur site"],["Moindre privilège","Chacun n’a que les droits strictement nécessaires"],["PCA","Poursuivre l’activité lors d’un incident, grâce aux sauvegardes"],["PRA","Reprendre l’activité après un sinistre majeur, via un site de secours"]],

["Un incendie détruit la salle serveurs ; l’entreprise bascule sur un site de secours. C’est…","Un PRA",[["Un PCA","Le PCA gère les incidents courants (restaurer une sauvegarde) ; ici le sinistre est majeur."],["Un audit","Un audit évalue les procédures, il ne relance pas l’activité."],["Une segmentation","Elle isole des zones du réseau ; elle ne remet rien en service."]]]],

{ic:"🎣",t:"Identité numérique et phishing",

["Les outils du TP1","<b>haveibeenpwned</b> : ton mail est-il dans une fuite ? <b>Lightbeam</b> : visualise les sites qui te pistent. <b>Whois</b> : propriétaire d’un domaine. <b>Alerte Google</b> et <b>flux RSS</b> (feedly) : veille numérique."],
["Le phishing (hameçonnage)","Une attaque d’<b>ingénierie sociale</b> : on exploite la <u>faille humaine</u>, pas une faille informatique. Faux mail de banque → lien → faux site copie conforme → tu saisis tes identifiants."],

["La fraude au PDG","Des escrocs usurpent l’adresse du PDG (<b>mail spoofing</b>) et demandent des virements à la responsable financière. Réflexe : <b>vérifier par un autre canal</b> (téléphone)."]],
M:[["Phishing","Faux mail qui pousse à saisir ses données sur un faux site"],["Ingénierie sociale","Exploiter la faille humaine plutôt qu’une faille technique"],["Mail spoofing","Usurper l’adresse d’un expéditeur, par exemple le PDG"],["haveibeenpwned","Indique si ton mail apparaît dans des fuites de données"],["Lightbeam","Montre le graphe des sites tiers qui te suivent"]],

{ic:"🦠",t:"Malwares et contre-mesures",

["Les autres","<b>Rootkit</b> : se cache et donne des droits élevés. <b>Botnet</b> : machines contrôlées à distance (DDoS). <b>Adware</b> : pubs intrusives. <b>Cryptojacker</b> : mine de la cryptomonnaie à ton insu. <b>Scareware</b> : fausses alertes pour te faire payer."],
["Les 5 phases d’une attaque","<b>Infection</b> (pièce jointe, USB, faille) → <b>Persistance</b> (reste après redémarrage) → <b>Dissimulation</b> / élévation de privilèges → <b>Propagation</b> (réseau) → <b>Exfiltration</b> / action finale (serveur C2)."],
["Les outils d’analyse","<b>VirusTotal</b> : analyse un fichier, un hash ou une URL. <b>MITRE ATT&amp;CK</b> : techniques des attaquants. <b>Sandbox</b> : exécution isolée pour observer. <b>IOC</b> : indices de compromission. <b>Forensic</b> : conserver les preuves."],
["Réagir","Le <b>CERT-FR</b> (rattaché à l’ANSSI) publie alertes et recommandations. Le <b>patch</b> corrige la faille. Bonne pratique : travailler en <b>session standard</b>, pas admin, pour limiter les dégâts d’un malware."]],
M:[["Ver","Se propage tout seul par le réseau, sans action humaine"],["Cheval de Troie","Semble légitime mais cache une charge malveillante"],["Sandbox","Environnement isolé pour observer un fichier suspect"],["VirusTotal","Analyse un fichier, un hash ou une URL avec plusieurs antivirus"],["IOC","Indice observable prouvant qu’un système est compromis"]],
Q:[["Un malware chiffre tes fichiers et réclame un paiement. C’est un…","Ransomware",[["Spyware","Il espionne en silence : il ne bloque rien."],["Adware","Il affiche des publicités, il ne chiffre pas tes fichiers."],["Rootkit","Il sert à se cacher et à obtenir des droits, pas à demander une rançon."]]],
["Dans quel ordre agit un malware ?","Infection → Persistance → Dissimulation → Propagation → Exfiltration",[["Persistance → Infection → Dissimulation → Propagation → Exfiltration","Il doit d’abord entrer sur la machine avant de pouvoir y rester."],["Infection → Exfiltration → Persistance → Dissimulation → Propagation","Le but final (vol, rançon) arrive en dernier."],["Propagation → Infection → Persistance → Dissimulation → Exfiltration","Il infecte une première machine avant de se propager."]]]],
C:[["Quelle commande Linux affiche la version du noyau (kernel) ?","uname -r","Le nom vient de « unix name », suivi de l’option r (release)."]]},
{ic:"🔑",t:"Mots de passe",
L:[["Prouver qui tu es","Authentification par <b>possession</b> (badge, clé), <b>biométrie</b> (empreinte) ou <b>connaissance</b> (mot de passe). L’identifiant dit qui tu prétends être ; l’authentification le prouve."],
["Le hash, une empreinte","Un site stocke le <b>hash</b> de ton mot de passe, pas le mot de passe. Changer une seule lettre change tout le hash. Un pirate vole le hash puis essaie de retrouver le mot de passe."],
["Comment on casse un mot de passe","<b>Force brute</b> (tout tester), <b>dictionnaire</b> (mots courants), <b>permutation</b> (123, a→@ sont connus), <b>ingénierie sociale</b> (infos perso trouvées en ligne), <b>phishing</b> et <b>réutilisation</b> du même mot de passe."],
["La force : N<sup>L</sup>","<b>N</b> = nombre de caractères possibles, <b>L</b> = longueur. Un PIN à 4 chiffres : 10<sup>4</sup> = 10 000 essais. La <b>longueur</b> pèse le plus. Bon réflexe : phrase de passe longue, unique par site, gestionnaire de mots de passe, double authentification."],

M:[["Force brute","Tester toutes les combinaisons possibles"],["Dictionnaire","Tester des mots courants et leurs variantes"],["Ingénierie sociale","Deviner à partir d’informations personnelles"],["/etc/shadow","Fichier Linux qui contient les hash des mots de passe"],["CVE","Identifiant public d’une vulnérabilité connue"]],
Q:[["Quel mot de passe est le plus solide ?","Une phrase aléatoire de 5 mots, longue",[["P@ssw0rd!","Ces substitutions (a→@, o→0) sont dans tous les dictionnaires."],["Caro1985","Prénom + année : trouvable par ingénierie sociale."],["MotDePasse123","Des mots courants + 123 : dictionnaire et permutation le cassent vite."]]],
["Même mot de passe sur un forum amateur et sur ta banque. Quel risque ?","Si le forum est piraté, ta banque est exposée",[["Aucun, le hash protège","Un hash faible se casse, et le pirate teste ensuite ce mot de passe ailleurs."],["Seulement perdre l’accès au forum","Les pirates visent justement les sites rentables avec les mots de passe volés."],["Le risque est de l’oublier","Le vrai danger est la sécurité, pas la mémoire."]]]],
